# JetPack 7.2 / Orin — AVM GPU Web
# Cameras are tegra-video CSI (not UVC): need /dev/media* + capture-vi-channel*
# in addition to /dev/video*. See docs/DOCKER.md.
services:
  avm-web:
    image: leucushc/avm-gpu:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ubuntu:24.04
    runtime: nvidia
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - OPENCV_CUDA_PREFIX=/opt/opencv-cuda
    volumes:
      - ./config:/app/config
      - ./calib_results:/app/calib_results
      - ./output:/app/output
      - /usr/local/cuda:/usr/local/cuda:ro
    # CSI pipeline devices (tegra-capture-vi). video* alone is not enough.
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/media0:/dev/media0
      - /dev/camsync:/dev/camsync
      - /dev/capture-vi-channel0:/dev/capture-vi-channel0
      - /dev/capture-vi-channel1:/dev/capture-vi-channel1
      - /dev/capture-vi-channel2:/dev/capture-vi-channel2
      - /dev/capture-vi-channel3:/dev/capture-vi-channel3
      - /dev/capture-vi-channel4:/dev/capture-vi-channel4
      - /dev/capture-vi-channel5:/dev/capture-vi-channel5
      - /dev/capture-vi-channel6:/dev/capture-vi-channel6
      - /dev/capture-vi-channel7:/dev/capture-vi-channel7
      - /dev/capture-vi-channel8:/dev/capture-vi-channel8
      - /dev/capture-vi-channel9:/dev/capture-vi-channel9
      - /dev/capture-vi-channel10:/dev/capture-vi-channel10
      - /dev/capture-vi-channel11:/dev/capture-vi-channel11
      - /dev/capture-vi-channel12:/dev/capture-vi-channel12
      - /dev/capture-vi-channel13:/dev/capture-vi-channel13
      - /dev/capture-vi-channel14:/dev/capture-vi-channel14
      - /dev/capture-vi-channel15:/dev/capture-vi-channel15
      - /dev/capture-vi-channel16:/dev/capture-vi-channel16
      - /dev/capture-vi-channel17:/dev/capture-vi-channel17
      - /dev/capture-vi-channel18:/dev/capture-vi-channel18
      - /dev/capture-vi-channel19:/dev/capture-vi-channel19
      - /dev/capture-vi-channel20:/dev/capture-vi-channel20
      - /dev/capture-vi-channel21:/dev/capture-vi-channel21
      - /dev/capture-vi-channel22:/dev/capture-vi-channel22
      - /dev/capture-vi-channel23:/dev/capture-vi-channel23
      - /dev/capture-vi-channel24:/dev/capture-vi-channel24
      - /dev/capture-vi-channel25:/dev/capture-vi-channel25
      - /dev/capture-vi-channel26:/dev/capture-vi-channel26
      - /dev/capture-vi-channel27:/dev/capture-vi-channel27
    group_add:
      - video
    restart: unless-stopped
